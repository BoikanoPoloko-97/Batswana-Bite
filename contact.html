<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batswana Bites | Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo-container">
            <img src="images/Batswana Bites Traditional Food Logo.png" alt="Batswana Bites Logo" class="site-logo">
            <div class="logo-text">BATSWANA <span>BITES</span></div>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="foods.html">Traditional Foods</a>
            <a href="recipes.html">Recipes</a>
            <a href="about.html">About Us</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Get in Touch</h1>
        <form style="max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px;">
            <input type="text" placeholder="Your Name" style="padding: 12px; border: 1px solid #ccc; border-radius: 5px;" required>
            <input type="email" placeholder="Your Email" style="padding: 12px; border: 1px solid #ccc; border-radius: 5px;" required>
            <textarea placeholder="Your Message" rows="5" style="padding: 12px; border: 1px solid #ccc; border-radius: 5px;" required></textarea>
            <button type="submit" style="padding: 12px; background: #00A3E0; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Batswana Bites - Promoting Botswana Traditional Foods.</p>
    </footer>

</body>
</html>
